<div class="container">
  <div><h2>Ajouter un Film :</h2></div>
  <form>
    <div class="col-sm-2 col-md-2 col-lg-2">
      <label>ID Film</label>
      <input type="number" [(ngModel)]="newfilm.idFilm" name="idFilm" class="form-control">
    </div>
    <div class="col-sm-4 col-md-4 col-lg-4">
      <label>Titre Film</label>
      <input type="text" [(ngModel)]="newfilm.titreFilm" name="titreFilm" class="form-control">
    </div>
    <div class="col-sm-2 col-md-2 col-lg-2">
      <label>Genre Film</label>
      <input type="text" [(ngModel)]="newfilm.genreFilm" name="genreFilm" class="form-control">
    </div>
    <div class="col-sm-2 col-md-2 col-lg-2">
      <label>Note Film</label>
      <input type="number" [(ngModel)]="newfilm.noteFilm" name="noteFilm" class="form-control">
    </div>
    <div class="col-sm-4 col-md-4 col-lg-4">
      <label>Date sortie</label>
      <input type="date" [(ngModel)]="newfilm.dateSortie" name="dateSortie" class="form-control">
    </div>
    <div class="mt-2">
      <button type="submit" (click)="addfilm()" class="btn btn-success">Ajouter</button>
    </div>
  </form>
</div>
