<div class="container">
  <h2>Modifier un Film :</h2>
  <form>
    <div class="col-sm-2 col-md-2 col-lg-2">
      <label>ID Film</label>
      <input readonly type="number" [(ngModel)]="currentFilm.idFilm" name="idFilm" class="form-control">
    </div>
    <div class="col-sm-4 col-md-4 col-lg-4">
      <label>Titre Film</label>
      <input type="text" [(ngModel)]="currentFilm.titreFilm" name="titreFilm" class="form-control">
    </div>
    <div class="col-sm-2 col-md-2 col-lg-2">
      <label>Genre Film</label>
      <input type="text" [(ngModel)]="currentFilm.genreFilm" name="genreFilm" class="form-control">
    </div>
    <div class="col-sm-2 col-md-2 col-lg-2">
      <label>Note Film</label>
      <input type="number" [(ngModel)]="currentFilm.noteFilm" name="noteFilm" class="form-control">
    </div>
    <div class="col-sm-4 col-md-4 col-lg-4">
      <label>Date Sortie</label>
      <input type="date" [(ngModel)]="currentFilm.dateSortie" name="dateSortie" class="form-control">
    </div>
    <div class="mt-2">
      <button type="submit" (click)="updateFilm()" class="btn btn-success">Modifier</button>
    </div>
  </form>
</div>
